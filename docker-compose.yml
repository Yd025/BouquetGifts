services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bouquet, POSTGRES_PASSWORD: bouquet, POSTGRES_DB: bouquet }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bouquet"], interval: 3s, retries: 20 }
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://bouquet:bouquet@db:5432/bouquet
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      DEMO_MODE: "1"
      # --- keys that drop in at 3 PM (each falls back to its mock when empty; check with `docker compose exec api npm run check:keys`) ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Sulafat}
      VISA_BASE_URL: ${VISA_BASE_URL:-https://sandbox.api.visa.com}
      VISA_USER_ID: ${VISA_USER_ID:-}
      VISA_PASSWORD: ${VISA_PASSWORD:-}
      VISA_CERT_PATH: ${VISA_CERT_PATH:-}
      VISA_KEY_PATH: ${VISA_KEY_PATH:-}
      VISA_CA_PATH: ${VISA_CA_PATH:-}
      NAC_API_KEY: ${NAC_API_KEY:-}
      NAC_BASE_URL: ${NAC_BASE_URL:-https://network-as-code.p-eu.rapidapi.com}
      NAC_TEST_PHONE: ${NAC_TEST_PHONE:-}
      # Live room: API publishes to the Durable Object worker; browsers connect to PUBLIC_REALTIME_URL by WebSocket.
      REALTIME_URL: ${REALTIME_URL:-http://realtime:8787}
      PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-http://localhost:8787}
      REALTIME_SECRET: ${REALTIME_SECRET:-dev-realtime-secret}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      # Cloudflare Turnstile: these are Cloudflare's official always-pass TEST keys. Replace with real keys for production.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      # Card art storage: Cloudflare R2 (S3 API) when R2_* is set, otherwise the local volume below.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-bouquet-art}
      STORAGE_DIR: /data/media
    volumes: [ "media:/data/media", "./secrets:/run/secrets/bouquet:ro" ]   # put Visa cert/key in ./secrets, set VISA_CERT_PATH=/run/secrets/bouquet/cert.pem
    depends_on: { db: { condition: service_healthy }, realtime: { condition: service_started } }
    ports: [ "4000:4000" ]
  realtime:
    build: ./realtime
    environment: { REALTIME_SECRET: "${REALTIME_SECRET:-dev-realtime-secret}" }
    ports: [ "8787:8787" ]
  web:
    build: ./web
    environment: { API_URL: "http://api:4000" }   # read at runtime by app/api/[...path]/route.ts
    depends_on: [ api ]
    ports: [ "3000:3000" ]
volumes: { pgdata: {}, media: {} }
